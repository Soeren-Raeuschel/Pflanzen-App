  const CATEGORY_DEFAULTS = {

  // Input normalization
  function normalizeInput(str) {
    if (!str || typeof str !== 'string') return '';
    return str
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // Remove diacritics
      .replace(/[^a-z0-9\s]/g, '') // Remove special chars
      .replace(/\s+/g, ' ') // Normalize whitespace
      .trim();
  }

  // Levenshtein distance for fuzzy matching
  function levenshteinDistance(a, b) {
    if (!a || !b) return Math.max((a || '').length, (b || '').length);
    const matrix = [];
    for (let i = 0; i <= b.length; i++) matrix[i] = [i];
    for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
    for (let i = 1; i <= b.length; i++) {
      for (let j = 1; j <= a.length; j++) {
        if (b.charAt(i-1) === a.charAt(j-1)) {
          matrix[i][j] = matrix[i-1][j-1];
        } else {
          matrix[i][j] = Math.min(
            matrix[i-1][j-1] + 1,
            matrix[i][j-1] + 1,
            matrix[i-1][j] + 1
          );
        }
      }
    }
    return matrix[b.length][a.length];
  }

  // Calculate similarity ratio (0-1)
  function getSimilarity(a, b) {
    const normA = normalizeInput(a);
    const normB = normalizeInput(b);
    if (normA === normB) return 1;
    const maxLen = Math.max(normA.length, normB.length);
    if (maxLen === 0) return 0;
    return 1 - levenshteinDistance(normA, normB) / maxLen;
  }

  // Robust plant matching with multiple strategies
  function matchPlant(input) {
    const normalized = normalizeInput(input);
    if (!normalized || normalized.length < 2) return null;

    // Strategy 1: Exact match in PLANT_DB
    if (PLANT_DB[normalized.charAt(0).toUpperCase() + normalized.slice(1)]) {
      return { type: normalized.charAt(0).toUpperCase() + normalized.slice(1), confidence: 1.0, strategy: 'exact' };
    }

    // Strategy 2: Exact match in synonyms
    for (const [mainName, synonyms] of Object.entries(PLANT_SYNONYMS)) {
      if (synonyms.includes(normalized) || normalized.includes(mainName.toLowerCase())) {
        return { type: mainName, confidence: 0.95, strategy: 'synonym' };
      }
    }

    // Strategy 3: Fuzzy match (similarity > 0.6)
    let bestMatch = null;
    let bestScore = 0.6;
    
    for (const dbName of Object.keys(PLANT_DB)) {
      const score = getSimilarity(normalized, dbName);
      if (score > bestScore) {
        bestScore = score;
        bestMatch = dbName;
      }
      // Also check synonyms
      const synonyms = PLANT_SYNONYMS[dbName] || [];
      for (const syn of synonyms) {
        const synScore = getSimilarity(normalized, syn);
        if (synScore > bestScore) {
          bestScore = synScore;
          bestMatch = dbName;
        }
      }
    }
    
    if (bestMatch) {
      return { type: bestMatch, confidence: bestScore, strategy: 'fuzzy' };
    }

    // Strategy 4: Category-based matching based on keywords
    const keywords = {
      succulent: ['sukkulente', 'succulent', 'kaktus', 'cactus', 'aloe', 'agave', 'echeveria', 'sedum'],
      tropical: ['tropisch', 'tropical', 'monstera', 'palm', 'banane', 'farn', 'orchidee'],
      herb: ['kraut', 'herb', 'basilikum', 'thymian', 'rosmarin', 'salbei', 'minze', 'petersilie'],
      vegetable: ['gemüse', 'vegetable', 'tomate', 'paprika', 'gurke', 'salat'],
      tree: ['baum', 'tree', 'ficus', 'oliven', 'zitrone', 'avocado'],
      fern: ['farn', 'fern', 'blau'],
      flowering: ['blume', 'flower', 'rose', 'geranie', 'petunie'],
      cactus: ['kaktus', 'cactus', 'opuntia', 'echinocactus']
    };

    for (const [category, words] of Object.entries(keywords)) {
      for (const word of words) {
        if (normalized.includes(word)) {
          return { type: category, confidence: 0.5, strategy: 'category' };
        }
      }
    }

    // Strategy 5: Return null - fallback will handle this
    return null;
  }

  // Get fallback data based on category
  function getFallbackData(input, matchResult) {
    const fallback = CATEGORY_DEFAULTS[matchResult?.type] || CATEGORY_DEFAULTS['unknown'];
    const category = matchResult?.strategy || 'fallback';
    
    return {
      name: input,
      category: fallback.category,
      confidence: matchResult?.confidence || 0.1,
      strategy: category,
      fallback: true,
      water: `Alle ${fallback.water} Tage gießen`,
      light: fallback.light,
      humidity: fallback.humidity,
      temperature: "18-25°C",
      fertilizer_interval: fallback.fertilizer,
      fertilizer_type: fallback.category === 'Sukkulente' || fallback.category === 'Kaktus' ? "Minimal düngen, nur in Wachstumsphase" : "Standard Dünger in Wachstumsphase",
      notes: getFallbackMessage(fallback.category, category)
    };
  }

  function getFallbackMessage(category, strategy) {
    const messages = {
      'Sukkulente': "Sukkulente speichern Wasser in ihren Blättern. Weniger gießen, Substrat zwischen den Gießgaben gut austrocknen lassen.",
      'Tropisch': "Tropische Pflanzen brauchen mehr Wasser und hohe Luftfeuchtigkeit. Regelmäßig besprühen.",
      'Kräuter': "Kräuter bevorzugen gleichmäßige Feuchtigkeit. Nicht austrocknen lassen.",
      'Gemüse': "Gemüsepflanzen brauchen viel Wasser und regelmäßige Nährstoffe. Kontinuierlich düngen.",
      'Baum': "Bäume brauchen tiefes Gießen. Erde zwischen den Gießgaben antrocknen lassen.",
      'Farn': "Farne lieben Feuchtigkeit und Schatten. Erde gleichmäßig feucht halten.",
      'Blühend': "Blühende Pflanzen brauchen mehr Energie. Regelmäßig düngen während der Blüte.",
      'Blattschmuck': "Zierpflanzen mit festen Blättern sind meist pflegeleicht. Normal gießen.",
      'Kaktus': "Kakteen brauchen sehr wenig Wasser. Nur gießen wenn Substrat komplett trocken.",
      'Unbekannt': "Pflegehinweise basieren auf allgemeinen Richtwerten. An die Pflanze anpassen."
    };
    
    let prefix = "";
    if (strategy === 'category') prefix = "Basierend auf Kategorie-Erkennung: ";
    else if (strategy === 'fallback') prefix = "Allgemeine Pflegerichtlinien: ";
    else prefix = "Annäherung an ähnliche Pflanze: ";
    
    return prefix + (messages[category] || messages['Unbekannt']);
  }

  // Enhanced findMatchingType with fallback messaging
  function findMatchingTypeWithFallback(plantName) {
    const result = matchPlant(plantName);
    if (result && result.strategy !== 'category') {
      return { type: result.type, confidence: result.confidence, strategy: result.strategy, fallback: false };
    }
    if (result && result.strategy === 'category') {
      const fallback = getFallbackData(plantName, result);
      return { type: "Andere", confidence: result.confidence, strategy: result.strategy, fallback: true, fallbackData: fallback };
    }
    // No match at all - use generic fallback
    const fallback = getFallbackData(plantName, { type: 'unknown', confidence: 0.1 });
    return { type: "Andere", confidence: 0.1, strategy: 'fallback', fallback: true, fallbackData: fallback };
  }

  let weatherData = null;
  const WEATHER_CACHE_KEY = 'pflanzen_weather_cache';
  const WEATHER_CACHE_DURATION = 24 * 60 * 60 * 1000; // 24 hours
  
  // Get cached weather data
  function getCachedWeather() {
    try {
      const cached = localStorage.getItem(WEATHER_CACHE_KEY);
      if (cached) {
        const data = JSON.parse(cached);
        if (data.timestamp && (Date.now() - data.timestamp < WEATHER_CACHE_DURATION)) {
          return data;
        }
      }
    } catch(e) {}
    return null;
  }
  
  // Save weather to cache
  function setCachedWeather(data) {
    try {
      localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify({
        ...data,
        timestamp: Date.now()
      }));
    } catch(e) {}
  }
  
  async function fetchWeather() {
    // Check cache first
    const cached = getCachedWeather();
    if (cached) {
      weatherData = cached;
      return weatherData;
    }
    
    try {
      const position = await new Promise((resolve, reject) => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 10000, maximumAge: WEATHER_CACHE_DURATION });
        } else {
          reject(new Error("No geolocation"));
        }
      });
      
      const lat = Math.max(-90, Math.min(90, position.coords.latitude));
      const lon = Math.max(-180, Math.min(180, position.coords.longitude));
      
      const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m&timezone=auto`);
      if (response.ok) {
        const data = await response.json();
        if (data.current) {
          weatherData = {
            temp: Math.round(data.current.temperature_2m),
            humidity: Math.round(data.current.relative_humidity_2m),
            lat: lat,
            lon: lon,
            updated: new Date().toISOString()
          };
          setCachedWeather(weatherData);
          return weatherData;
        }
      }
    } catch(e) { 
      try {
        const response = await fetch("https://api.open-meteo.com/v1/forecast?latitude=52.52&longitude=13.41&current=temperature_2m,relative_humidity_2m&timezone=auto");
        if (response.ok) {
          const data = await response.json();
          weatherData = {
            temp: Math.round(data.current.temperature_2m),
            humidity: Math.round(data.current.relative_humidity_2m),
            lat: 52.52,
            lon: 13.41,
            updated: new Date().toISOString()
          };
          setCachedWeather(weatherData);
          return weatherData;
        }
      } catch(e2) {}
    }
    return null;
  }

  function analyzeRoomConditions(plant, room) {
    const issues = [];
    const plantInfo = PLANT_DB[plant.type] || {};
    const aiData = plant.aiData || {};
    
    if (!room) return issues;
    
    if (room.temperature && aiData.temperature) {
      const tempMatch = aiData.temperature.match(/(\d+)\s*[-–]\s*(\d+)/);
      if (tempMatch) {
        const minTemp = parseInt(tempMatch[1]);
        const maxTemp = parseInt(tempMatch[2]);
        if (room.temperature < minTemp || room.temperature > maxTemp) {
          issues.push(`Temperatur ${room.temperature}°C außerhalb Optimalbereich (${aiData.temperature})`);
        }
      }
    }
    
    if (room.humidity && aiData.humidity) {
      const hum = aiData.humidity.toLowerCase();
      if (hum.includes("hoch") && room.humidity < 60) {
        issues.push(`Luftfeuchtigkeit zu niedrig (${room.humidity}%). Pflanze braucht hohe Luftfeuchtigkeit.`);
      } else if (hum.includes("niedrig") && room.humidity > 40) {
        issues.push(`Luftfeuchtigkeit zu hoch (${room.humidity}%). Pflanze bevorzugt trockene Luft.`);
      }
    }
    
    if (room.id === "balkon" || room.id === "garten") {
      if (aiData.light?.includes("indirekt") || aiData.light?.includes("Halbschatten")) {
        issues.push("Pflanze preferiert indirektes Licht, direkte Sonne am Balkon könnte schaden.");
      }
    }
    
    return issues;
  }

  // ── Umtopfen & Schnitt ─────────────────────────────────
  function getRepotInfo(plant) {
    const info = PLANT_DB[plant.type] || PLANT_DB["Andere"];
    // Prefer AI data, fall back to static DB
    const repotMonths = plant.aiData?.repot_months || plant.repot_months || info.repot_months || 18;
    const repotSeason = plant.aiData?.repot_season || info.repot_season || "Frühling";
    const growthRate = plant.aiData?.growth_rate || info.growth_rate || "mittel";
    const addedDate = plant.added_date ? new Date(plant.added_date) : null;
    
    if (!addedDate) {
      const intervalText = repotMonths >= 12
        ? `alle ~${Math.round(repotMonths / 12)} Jahr${Math.round(repotMonths / 12) !== 1 ? "e" : ""}`
        : `alle ~${repotMonths} Monate`;
      return { label: `Empfohlen: ${intervalText}`, detail: `Saison: ${repotSeason}`, sub: `Wachstum: ${growthRate}`, daysUntil: null, urgent: false };
    }
    
    const repotDays = repotMonths * 30;
    const daysSinceAdded = Math.floor((Date.now() - addedDate.getTime()) / 86400000);
    const daysLeft = repotDays - daysSinceAdded;
    const monthsLeft = Math.round(daysLeft / 30);
    
    if (daysLeft <= 0) {
      return { label: "Umtopfen fällig!", detail: `Saison: ${repotSeason}`, sub: `Wachstum: ${growthRate}`, daysUntil: 0, urgent: true };
    }
    if (monthsLeft <= 1) {
      return { label: `Umtopfen in ~${daysLeft} Tagen`, detail: `Saison: ${repotSeason}`, sub: `Wachstum: ${growthRate}`, daysUntil: daysLeft, urgent: true };
    }
    return { label: `in ~${monthsLeft} Monaten`, detail: `Saison: ${repotSeason}`, sub: `Wachstum: ${growthRate}`, daysUntil: daysLeft, urgent: false };
  }

  function getPruningInfo(plant) {

    const lengthCm = plant.aiData?.pruning_length_cm !== undefined ? plant.aiData.pruning_length_cm : info.pruning_length_cm;
    if (!season) return null;
    const lengthText = lengthCm ? `Auf ${lengthCm} cm zurückschneiden` : "Nur welke/tote Triebe entfernen";
    return { season, length: lengthText, hasLength: !!lengthCm };

  function daysSince(d) {
    if (!d) return null;
    try {
      const date = new Date(d);
      if (isNaN(date.getTime())) return null;
      return Math.floor((Date.now() - date.getTime()) / 86400000);
    } catch { return null; }
  }
  function needsWater(p) {
    if (!p || !p.type) return false;
    const d = daysSince(p.last_watered_date);
    if (d === null) return true;
    const interval = p.watering_interval || PLANT_DB[p.type]?.watering_interval || 7;
    return d >= Math.max(1, interval);
  }
  function daysUntil(p) {
    if (!p || !p.type) return 0;
    const d = daysSince(p.last_watered_date);
    if (d === null) return 0;
    const interval = p.watering_interval || PLANT_DB[p.type]?.watering_interval || 7;
    return Math.max(0, Math.max(1, interval) - d);
  }
  function needsFertilizer(p) {
    if (!p || !p.fertilizer_interval || p.fertilizer_interval === 0) return false;
    const d = daysSince(p.last_fertilized_date);
    if (d === null) return true;
    return d >= p.fertilizer_interval;
  }
  function daysUntilFertilizer(p) {
    if (!p || !p.fertilizer_interval || p.fertilizer_interval === 0) return null;
    const d = daysSince(p.last_fertilized_date);
    if (d === null) return 0;
    return Math.max(0, p.fertilizer_interval - d);
  }
  // Saisonbewusste Varianten (analog zu needsWaterAdaptive)
  function needsFertilizerAdaptive(p, rooms) {
    if (!p || !p.fertilizer_interval || p.fertilizer_interval === 0) return false;
    const room = (rooms || []).find(r => r && r.id === p.room_id) || null;
    const enhanced = getEnhancedFertilizerInterval(p, room);
    if (!enhanced.active) return false;
    const d = daysSince(p.last_fertilized_date);
    if (d === null) return true;
    return d >= enhanced.interval;
  }
  function daysUntilFertilizerAdaptive(p, rooms) {
    if (!p || !p.fertilizer_interval || p.fertilizer_interval === 0) return null;
    const room = (rooms || []).find(r => r && r.id === p.room_id) || null;
    const enhanced = getEnhancedFertilizerInterval(p, room);
    const d = daysSince(p.last_fertilized_date);
    if (d === null) return 0;
    return Math.max(0, enhanced.interval - d);
  }

      herb: ["Basilikum", "Minze", "Thymian", "Lavendel"],
      vegetable: ["Tomate", "Paprika", "Zitrone"],
      tree: ["Ficus", "Palme", "Olivenbaum", "Bonsai", "Rose"],
      vine: ["Pothos", "Efeu"],
      other: ["Andere"]
    };
    for (const [cat, types] of Object.entries(categories)) {
      if (types.includes(type)) return cat;
    }
    return "other";
  }

  function getBaseWateringInterval(plantType) {
    const cat = getPlantCategory(plantType);
    if (cat === "succulent") return 14;
    if (cat === "tropical") return 5;
    if (cat === "herb") return 3;
    if (cat === "vegetable") return 3;
    return 7;
  }

  // Modifikatoren für das Gieß-INTERVALL (Tage zwischen Gießgaben).
  // Wert < 1.0 = kürzeres Intervall = öfter gießen. Wert > 1.0 = seltener gießen.
  // fertilizer-Werte (für getEnhancedFertilizerInterval): < 1.0 = öfter düngen.
  const SEASON_MODIFIERS = {
    summer: { water: 0.8,  fertilizer: 0.8  },  // Sommer: öfter gießen & düngen
    spring: { water: 0.9,  fertilizer: 0.9  },  // Frühling: leicht öfter
    autumn: { water: 1.1,  fertilizer: 1.4  },  // Herbst: seltener gießen, weniger düngen
    winter: { water: 1.4,  fertilizer: 3.0  }   // Winter: deutlich seltener, kaum düngen
  };

  const LOCATION_MODIFIERS = {
    balcony: 0.85,  // Wind + direktere Sonne → öfter gießen
    garden:  0.9,   // ähnlich wie Balkon
    indoor:  1.0,   // Basis
    bathroom: 1.15, // hohe Luftfeuchtigkeit → seltener gießen
    kitchen: 0.95   // tendenziell warm & trocken → etwas öfter
  };

  const CLIMATE_MODIFIERS = {
    hot: 0.85,
    warm: 0.9,
    moderate: 1.0,
    cool: 1.15,
    cold: 1.25
  };

  const LOCATION_TRANSLATIONS = {
    balcony: "Balkon",
    garden: "Garten",
    indoor: "Innenraum",
    bathroom: "Bad",
    kitchen: "Küche"
  };

  const CLIMATE_TRANSLATIONS = {
    hot: "Heiß",
    warm: "Warm",
    moderate: "Moderat",
    cool: "Kühl",
    cold: "Kalt"
  };

  function getLocationFromRoom(room) {
    if (!room || !room.name) return "indoor";
    const name = room.name.toLowerCase();
    if (name.includes("balkon") || name.includes("terrasse")) return "balcony";
    if (name.includes("garten") || name.includes("außen")) return "garden";
    if (name.includes("bad")) return "bathroom";
    if (name.includes("küche") || name.includes("kitchen")) return "kitchen";
    return "indoor";
  }

  function determineClimate(temperature) {
    if (temperature === null || temperature === undefined) return "moderate";
    if (temperature >= 26) return "hot";
    if (temperature >= 20) return "warm";
    if (temperature >= 12) return "moderate";
    return "cold";
  }

  // Hauptfunktion für sichere Gießanpassung
  function getEnhancedWateringInterval(plant, room) {
    if (!plant || !plant.type) {
      return { interval: 7, reasons: [], baseInterval: 7, status: "standard", minDays: 2 };
    }
    
    // ── Basis-Intervall: plant.watering_interval hat absolute Priorität ──
    // Erst KI-Wert (gespeichert auf plant), dann statische DB, dann Kategorie-Schätzung
    const storedInterval = plant.watering_interval;
    const dbInterval = PLANT_DB[plant.type]?.watering_interval;
    const catInterval = getBaseWateringInterval(plant.type);
    const baseInterval = (storedInterval && storedInterval > 0) ? storedInterval
                       : (dbInterval && dbInterval > 0) ? dbInterval
                       : catInterval;

    const season = getCurrentSeason();
    const location = getLocationFromRoom(room);
    const temperature = room?.temperature ?? null;
    const climate = determineClimate(temperature);
    
    let adjusted = baseInterval;
    let reasons = [];
    let riskWarnings = [];
    
    // 1. Saison-Anpassung — nur wenn kein Raum-Override
    const seasonMod = SEASON_MODIFIERS[season];
    if (seasonMod && seasonMod.water !== 1.0) {
      adjusted *= seasonMod.water;
      const pct = Math.round((seasonMod.water - 1) * 100);
      reasons.push(`${getSeasonName(season)}: ${pct > 0 ? '+' : ''}${pct}%`);
    }
    
    // 2. Standort-Anpassung — nur wenn nicht "indoor" (neutral)
    const locMod = LOCATION_MODIFIERS[location];
    if (locMod && locMod !== 1.0) {
      adjusted *= locMod;
      reasons.push(`Standort: ${LOCATION_TRANSLATIONS[location] || location}`);
    }
    
    // 3. Klima-Anpassung — nur wenn nicht "moderate"
    const climateMod = CLIMATE_MODIFIERS[climate];
    if (climateMod && climateMod !== 1.0) {
      adjusted *= climateMod;
      reasons.push(`Klima: ${CLIMATE_TRANSLATIONS[climate] || climate}`);
    }
    
    // 4. Sicherheits-Beschränkungen: max ±35% vom Basis-Intervall, und absolute Minima
    const cat = getPlantCategory(plant.type);
    const minAbsolute = cat === "succulent" ? 7 : (cat === "herb" || cat === "vegetable") ? 1 : 2;
    const lowerBound = Math.max(minAbsolute, baseInterval * 0.65);
    const upperBound = baseInterval * 1.5; // max 50% länger (z.B. Winter-Ruhephase)
    adjusted = Math.min(upperBound, Math.max(lowerBound, adjusted));
    
    // 5. Warnungen
    if (season === "winter" && cat !== "tropical" && cat !== "herb") {
      riskWarnings.push("Winter: Überwässerungsrisiko — Erde vor dem Gießen prüfen");
    }
    if (season === "summer" && location === "balcony") {
      riskWarnings.push("Balkon Sommer: Erde täglich kontrollieren");
    }
    
    const finalInterval = Math.max(minAbsolute, Math.round(adjusted));
    const daysSinceWater = daysSince(plant.last_watered_date);
    let status = "safe";
    if (daysSinceWater !== null && daysSinceWater >= Math.floor(finalInterval * 0.88)) status = "ready";
    else if (daysSinceWater !== null && daysSinceWater < Math.floor(finalInterval * 0.4)) status = "too-early";
    
    return {
      interval: finalInterval,
      baseInterval: baseInterval,
      reasons: reasons,
      wasAdjusted: finalInterval !== baseInterval,
      season: getSeasonName(season),
      location: location,
      climate: climate,
      status: status,
      riskWarnings: riskWarnings,
      minDays: minAbsolute,
      checkSoil: true
    };
  }

  // Erweiterte Dünge-Logik
  function getEnhancedFertilizerInterval(plant, room) {
    if (!plant || !plant.fertilizer_interval || plant.fertilizer_interval === 0) {
      return { interval: 0, active: false, reasons: [], seasonWarning: null };
    }
    
    const season = getCurrentSeason();
    const location = getLocationFromRoom(room);
    const baseInterval = plant.fertilizer_interval;
    let adjusted = baseInterval;
    let reasons = [];
    let seasonWarning = null;
    
    // Saison-Modifier aus zentraler Tabelle verwenden (fertilizer-Wert)
    const seasonMod = SEASON_MODIFIERS[season];
    if (seasonMod && seasonMod.fertilizer !== 1.0) {
      adjusted *= seasonMod.fertilizer;
      if (season === "winter") {
        seasonWarning = "Winter: Düngen stark reduzieren";
        reasons.push("Winter – Ruhephase");
      } else if (season === "summer") {
        reasons.push("Sommer – Wachstumsphase");
      } else if (season === "autumn") {
        reasons.push("Herbst – Düngung reduzieren");
      } else if (season === "spring") {
        reasons.push("Frühling – Wachstum beginnt");
      }
    }
    
    // Balkon im Sommer: zusätzlicher Boost (mehr Licht & Wachstum)
    if (location === "balcony" && season === "summer") {
      adjusted *= 0.9;
      reasons.push("Balkon im Sommer");
    }
    
    // Absolute Untergrenze: nie öfter als alle 7 Tage düngen
    adjusted = Math.max(7, Math.round(adjusted));
    
    // Im Winter bei sehr langen Intervallen komplett pausieren
    const active = !(season === "winter" && adjusted > 90);
    if (!active) seasonWarning = "Winter: Düngen pausieren";
    
    return {
      interval: adjusted,
      active,
      reasons: reasons,
      baseInterval: baseInterval,
      season: getSeasonName(season),
      seasonWarning: seasonWarning
    };
  }

  // Überwinterungs-Tipps für Balkonpflanzen
  const OVERWINTERING_TIPS = {
    "Monstera": {
      bringIndoors: true,
      minTemp: 15,
      watering: "Reduzieren auf alle 10-14 Tage",

  function getOverwinteringTips(plant, room) {
    const season = getCurrentSeason();
    const location = getLocationFromRoom(room);
    
    // Nur im Herbst und Winter für Balkonpflanzen anzeigen
    if (location !== "balcony" || (season !== "autumn" && season !== "winter")) {
      return null;
    }
    
    const plantType = plant.type || "Andere";
    const tips = OVERWINTERING_TIPS[plantType] || OVERWINTERING_TIPS["default"];
    
    // Aktuelle Temperatur berücksichtigen
    const currentTemp = room?.temperature;
    const needsIndoors = currentTemp !== null && currentTemp < tips.minTemp;
    
    const status = {
      showTips: true,
      season: getSeasonName(season),
      location: "Balkon",
      bringIndoors: tips.bringIndoors,
      needsIndoorsNow: needsIndoors,
      minTemperature: tips.minTemp,
      wateringAdvice: tips.watering,
      careAdvice: tips.care,
      frostRisk: tips.frostRisk,
      generalTip: season === "autumn" 
        ? "🌨️ Winter steht bevor - bereite deine Pflanzen vor!"
        : "❄️ Kälteperiode - prüfe regelmäßig den Zustand"
    };
    
    return status;
  }

  // Fallback für Kompatibilität
  function getAdaptiveWateringInterval(plant, room) {
    if (!plant || !plant.type) {
      return { interval: 7, reasons: [], baseInterval: 7 };
    }
    
    const baseInterval = Math.max(1, plant.watering_interval || PLANT_DB[plant.type]?.watering_interval || 7);
    
    if (!room || (room.temperature === null && room.humidity === null)) {
      return { interval: baseInterval, reasons: [], baseInterval };
    }
    
    let adjustedInterval = baseInterval;
    let adjustmentReason = [];
    
    // Temperatur-Anpassung (sicher mit null-checks)
    const temp = typeof room.temperature === 'number' ? room.temperature : null;
    if (temp !== null && !isNaN(temp)) {
      if (temp >= 28) {
        adjustedInterval = Math.max(1, Math.floor(baseInterval * 0.5));
        adjustmentReason.push("sehr warm");
      } else if (temp >= 25) {
        adjustedInterval = Math.max(1, Math.floor(baseInterval * 0.7));
        adjustmentReason.push("warm");
      } else if (temp >= 22) {
        adjustedInterval = Math.max(1, Math.floor(baseInterval * 0.85));
        adjustmentReason.push("mäßig warm");
      } else if (temp <= 8) {
        adjustedInterval = Math.floor(baseInterval * 1.7);
        adjustmentReason.push("kalt");
      } else if (temp <= 12) {
        adjustedInterval = Math.floor(baseInterval * 1.4);
        adjustmentReason.push("kühl");
      } else if (temp <= 15) {
        adjustedInterval = Math.floor(baseInterval * 1.2);
        adjustmentReason.push("frisch");
      }
    }
    
    // Luftfeuchtigkeits-Anpassung (sicher mit null-checks)
    const humidity = typeof room.humidity === 'number' ? room.humidity : null;
    if (humidity !== null && !isNaN(humidity)) {
      if (humidity <= 25) {
        adjustedInterval = Math.max(1, Math.floor(adjustedInterval * 0.5));
        adjustmentReason.push("sehr trocken");
      } else if (humidity <= 35) {
        adjustedInterval = Math.max(1, Math.floor(adjustedInterval * 0.7));
        adjustmentReason.push("trocken");
      } else if (humidity <= 45) {
        adjustedInterval = Math.max(1, Math.floor(adjustedInterval * 0.85));
        adjustmentReason.push("gering feucht");
      } else if (humidity >= 85) {
        adjustedInterval = Math.floor(adjustedInterval * 1.7);
        adjustmentReason.push("sehr feucht");
      } else if (humidity >= 75) {
        adjustedInterval = Math.floor(adjustedInterval * 1.4);
        adjustmentReason.push("feucht");
      } else if (humidity >= 65) {
        adjustedInterval = Math.floor(adjustedInterval * 1.2);
        adjustmentReason.push("mäßig feucht");
      }
    }
    
    const finalInterval = Math.max(1, Math.round(adjustedInterval));
    
    return {
      interval: finalInterval,
      reasons: adjustmentReason,
      baseInterval: baseInterval,
      wasAdjusted: finalInterval !== baseInterval
    };
  }

  function needsWaterAdaptive(plant, rooms) {
    if (!plant || !plant.type) return false;
    if (!plant.room_id || !rooms || rooms.length === 0) return needsWater(plant);
    const room = rooms.find(r => r && r.id === plant.room_id);
    if (!room) return needsWater(plant);
    const adaptive = getEnhancedWateringInterval(plant, room, plant.watering_interval);
    const d = daysSince(plant.last_watered_date);
    if (d === null) return true;
    return d >= adaptive.interval;
  }

  function daysUntilAdaptive(plant, rooms) {
    if (!plant || !plant.type) return 0;
    if (!plant.room_id || !rooms || rooms.length === 0) return daysUntil(plant);
    const room = rooms.find(r => r && r.id === plant.room_id);
    if (!room) return daysUntil(plant);
    const adaptive = getEnhancedWateringInterval(plant, room, plant.watering_interval);
    const d = daysSince(plant.last_watered_date);
    if (d === null) return 0;
    return Math.max(0, adaptive.interval - d);
  }

  // ── DiscoverView ─────────────────────────────────────────
  function DiscoverView() {
    const categories = [
      { id: "sun", icon: "🌞", label: "Viel Sonne (Outdoor)", prompt: "Pflanzen die viel direktes Sonnenlicht brauchen und für den Garten oder Balkon geeignet sind" },
      { id: "sleep", icon: "🌙", label: "Schlafqualität", prompt: "Pflanzen die die Schlafqualität verbessern und beruhigend wirken" },
      { id: "easy", icon: "🌱", label: "Pflegeleicht", prompt: "Sehr pflegeleichte Zimmerpflanzen für Anfänger" },
      { id: "air", icon: "🌬️", label: "Luftreinigend", prompt: "Pflanzen die die Luftqualität verbessern und Schadstoffe filtern" },
    ];
    
    const [activeCategory, setActiveCategory] = useState(null);
    const [recommendations, setRecommendations] = useState(null);
    const [loading, setLoading] = useState(false);

    const fetchRecommendations = async (category) => {
      if (activeCategory === category && recommendations) {
        setActiveCategory(null);
        setRecommendations(null);
        return;
      }
      
      setActiveCategory(category);
      setLoading(true);
      
      try {
        const apiKey = getApiKey();
        if (!apiKey) {
          setRecommendations({ error: "Kein API-Key konfiguriert. Bitte in Einstellungen eintragen." });
          setLoading(false);
          return;
        }
        
        const cat = categories.find(c => c.id === category);
        const safePrompt = sanitizeInput(cat.prompt);
        const prompt = `Gib mir 5-6 Empfehlungen für ${safePrompt}. Antworte als JSON-Array mit diesem Format:
[
  { "name": "Pflanzenname", "reason": "Kurze Begründung warum diese Pflanze", "care": "Pflegetipp" }
]
Nur JSON, keine Erklärungen.`;
        
        let response;
        try {
          response = await fetchWithTimeout("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${apiKey}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              model: "llama-3.1-8b-instant",
              messages: [{ role: "user", content: prompt }],
              temperature: 0.3,
              max_tokens: 800
            })
          }, 15000);
        } catch (e) {
          if (e.name === 'AbortError') {
            setRecommendations({ error: "Zeitüberschreitung. Bitte erneut versuchen." });
            setLoading(false);
            return;
          }
          throw e;
        }
        
        if (response.ok) {
          const data = await response.json();
          if (!data.choices || !data.choices[0]) {
            setRecommendations({ error: "Ungültige Antwort vom Server" });
          } else {
            const content = data.choices[0].message.content;
            const jsonMatch = content.match(/\[[\s\S]*\]/);
            if (jsonMatch) {
              try {
                const parsed = JSON.parse(jsonMatch[0]);
                if (Array.isArray(parsed) && parsed.length > 0) {
                  setRecommendations(parsed);
                } else {
                  setRecommendations({ error: "Keine Ergebnisse gefunden" });
                }
              } catch(parseErr) {
                setRecommendations({ error: "Fehler beim Verarbeiten der Antwort" });
              }
            } else {
              setRecommendations({ error: "Keine Ergebnisse gefunden" });
            }
          }
        } else {
          setRecommendations({ error: `Server-Fehler (${response.status})` });
        }
      } catch (e) {
        setRecommendations({ error: "Verbindungsfehler. Bitte erneut versuchen." });
      }
      
      setLoading(false);
    };

    return React.createElement('div', { style: { padding: `calc(52px + env(safe-area-inset-top,0px)) 20px 20px`, maxWidth: 430, margin: "0 auto", paddingBottom: 100 } },
      React.createElement('h1', { style: { fontFamily: "'Cormorant Garamond'", fontSize: 34, fontWeight: 500, marginBottom: 8 } }, "Entdecken"),
      React.createElement('p', { style: { fontSize: 14, color: C.muted, marginBottom: 24 } }, "Finde die perfekte Pflanze für dich"),
      
      // Categories
      React.createElement('div', { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 24 } },
        categories.map(cat =>
          React.createElement('div', {
            key: cat.id,
            onClick: () => fetchRecommendations(cat.id),
            style: {
              background: activeCategory === cat.id ? C.accent : C.card,
              border: `1px solid ${activeCategory === cat.id ? C.accent : C.border}`,
              borderRadius: 16,
              padding: 20,
              cursor: "pointer",
              transition: "all 0.2s ease",
              boxShadow: activeCategory === cat.id ? `0 4px 12px ${C.accent}40` : "0 2px 8px rgba(0,0,0,0.04)"
            }
          },
            React.createElement('span', { style: { fontSize: 28, display: "block", marginBottom: 8 } }, cat.icon),
            React.createElement('p', { style: { fontSize: 14, fontWeight: 500, color: activeCategory === cat.id ? C.inverse : C.text } }, cat.label)
          )
        )
      ),
      
      // Results
      loading && React.createElement('div', { style: { textAlign: "center", padding: 40 } },
        React.createElement('span', { fontSize: 32 }, "⏳"),
        React.createElement('p', { style: { fontSize: 14, color: C.muted, marginTop: 12 } }, "Lade Empfehlungen...")
      ),
      
      recommendations && !recommendations.error && React.createElement('div', { style: { display: "flex", flexDirection: "column", gap: 12 } },
        React.createElement('p', { style: { fontSize: 12, fontWeight: 500, color: C.muted, letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 8 } }, "Empfehlungen"),
        recommendations.map((rec, i) =>
          React.createElement('div', {
            key: i,
            style: { background: C.card, borderRadius: 16, padding: 20, border: `1px solid ${C.border}`, boxShadow: "0 2px 8px rgba(0,0,0,0.04)" }
          },
            React.createElement('div', { style: { display: "flex", alignItems: "center", gap: 12, marginBottom: 8 } },
              React.createElement('span', { fontSize: 24 }, "🌿"),
              React.createElement('p', { fontSize: 16, fontWeight: 600 }, rec.name)
            ),
            rec.reason && React.createElement('p', { style: { fontSize: 13, color: C.muted, marginBottom: 6 } }, rec.reason),
            rec.care && React.createElement('p', { style: { fontSize: 12, color: C.accent, background: C.accentLight, padding: "8px 12px", borderRadius: 8 } }, "💡 " + rec.care)
          )
        )
      ),
      
      recommendations && recommendations.error && React.createElement('div', { style: { background: C.warnLight, borderRadius: 16, padding: 20, border: `1px solid ${C.warnBorder}` } },
        React.createElement('p', { style: { color: C.warn, fontSize: 14 } }, recommendations.error)
      )
    );
  }

  const GROQ_MODEL = "llama-3.1-8b-instant";
  const STORAGE_KEY_API = "pflanzen_groq_api_key";
  
  function getApiKey() {
    try { return localStorage.getItem(STORAGE_KEY_API) || ""; } catch { return ""; }
  }
  function setApiKey(key) {
    try { localStorage.setItem(STORAGE_KEY_API, key); } catch {}
  }

  const plantCache = {};

  // Input Sanitization - verhindert XSS und Injection
  function sanitizeInput(str) {
    if (typeof str !== 'string') return '';
    return str
      .replace(/[<>]/g, '') // Entferne HTML-Tags
      .replace(/[\u0000-\u001F\u007F]/g, '') // Entferne Kontrollzeichen
      .trim()
      .slice(0, 200); // Maximale Länge
  }

  // Timeout-Wrapper für API-Calls
  function fetchWithTimeout(url, options, timeoutMs = 15000) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), timeoutMs);
    return fetch(url, { ...options, signal: controller.signal })
      .finally(() => clearTimeout(timeout));
  }

  async function fetchPlantData(plantName) {
    const apiKey = getApiKey();
    if (!apiKey) {
      throw new Error("Kein API-Key konfiguriert. Bitte in Settings eintragen.");
    }
    
    // Input validieren und sanitieren
    const safeName = sanitizeInput(plantName);
    if (!safeName || safeName.length < 2) {
      throw new Error("Ungültiger Pflanzenname.");
    }
    
    if (plantCache[safeName.toLowerCase()]) {
      return plantCache[safeName.toLowerCase()];
    }

    const month = new Date().getMonth() + 1;
    const season = month >= 3 && month <= 5 ? "Frühling" : month >= 6 && month <= 8 ? "Sommer" : month >= 9 && month <= 11 ? "Herbst" : "Winter";

    const prompt = `Du bist ein Pflanzenexperte. Gib präzise Pflegeinformationen für die Pflanze "${safeName}" als JSON zurück. Aktuell ist ${season}. Antworte NUR mit diesem exakten JSON-Format, keine Erklärungen davor oder danach:

{
  "name": "Gebräuchlicher Pflanzenname auf Deutsch",
  "latin_name": "Wissenschaftlicher lateinischer Name (z.B. 'Monstera deliciosa')",
  "light": "Lichtbedarf (z.B. 'Hell, indirekt' oder 'Volle Sonne')",
  "water": "Gießverhalten mit konkretem Intervall (z.B. 'Alle 7-10 Tage, Erde antrocknen lassen')",
  "watering_interval_days": 9,
  "humidity": "Optimale Luftfeuchtigkeit (z.B. 'Hoch (60-80%)')",
  "temperature": "Optimaler Temperaturbereich (z.B. '18-24°C')",
  "fertilizer_interval": 14,
  "fertilizer_type": "Düngerart und Häufigkeit (z.B. 'Flüssigdünger alle 2 Wochen im Sommer')",
  "repot_months": 18,
  "repot_season": "Beste Jahreszeit zum Umtopfen (z.B. 'Frühling')",
  "pruning_season": "Zeitpunkt für Rückschnitt (z.B. 'Frühjahr' oder null wenn kein Schnitt nötig)",
  "pruning_length_cm": 10,
  "growth_rate": "Wachstumsgeschwindigkeit (langsam/mittel/schnell)",
  "notes": "Wichtige Pflegehinweise inkl. saisonaler Tipps für ${season}"
}

Wichtig: fertilizer_interval, repot_months und watering_interval_days müssen Zahlen sein. watering_interval_days ist die exakte Anzahl Tage zwischen den Gießgaben (als einzelne ganze Zahl, z.B. 9). pruning_length_cm ist die empfohlene Schnitthöhe in cm oder null. latin_name ist der korrekte botanische Name.`;

    const maxRetries = 3;
    for (let attempt = 0; attempt < maxRetries; attempt++) {
      try {
        const response = await fetchWithTimeout("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: GROQ_MODEL,
            messages: [{ role: "user", content: prompt }],
            temperature: 0.3,
            max_tokens: 800
          })
        }, 15000);

        if (response.status === 429) {
          await new Promise(r => setTimeout(r, 2000 * (attempt + 1)));
          continue;
        }

        if (!response.ok) {
          throw new Error(`API-Fehler: ${response.status}`);
        }

        const data = await response.json();
        if (!data.choices || !data.choices[0]) {
          throw new Error("Ungültige API-Antwort");
        }
        
        const content = data.choices[0].message.content;
        const jsonMatch = content.match(/\{[\s\S]*\}/);
        
        if (jsonMatch) {
          const parsed = JSON.parse(jsonMatch[0]);
          // Validierung der geparsten Daten
          if (!parsed.name || !parsed.water) {
            throw new Error("Unvollständige Pflanzendaten");
          }
          plantCache[safeName.toLowerCase()] = parsed;
          return parsed;
        }
        throw new Error("Keine gültigen Daten gefunden");
      } catch (e) {
        if (e.name === 'AbortError') {
          throw new Error("Zeitüberschreitung. Bitte erneut versuchen.");
        }
        if (attempt === maxRetries - 1) throw e;
        await new Promise(r => setTimeout(r, 1000));
      }
    }
  }

  function AddPlant({ onAdd, onBack, existingPlants = [], rooms = [] }) {
    const [name, setName] = useState("");
    const [customName, setCustomName] = useState("");
    const [type, setType] = useState("Monstera");
    const [notes, setNotes] = useState("");
    const [alreadyWatered, setAlreadyWatered] = useState(true);
    const [fertilizerEnabled, setFertilizerEnabled] = useState(false);
    const [fertilizerInterval, setFertilizerInterval] = useState(14);
    const [fertilizerType, setFertilizerType] = useState("");
    const [roomId, setRoomId] = useState("");
    const [isLoading, setIsLoading] = useState(false);
    const [error, setError] = useState(null);
    const [matchInfo, setMatchInfo] = useState(null);

    const submit = async () => {
      if (!name.trim()) return;
      setError(null);
      setMatchInfo(null);

      setIsLoading(true);
      try {
        const aiData = await fetchPlantData(name.trim());
        
        // Use robust matching
        const matchResult = findMatchingTypeWithFallback(aiData.name || name.trim());
        
        const aiFertilizerInterval = parseInt(aiData.fertilizer_interval) || 0;
        
        // ── Gießintervall: Robuste Extraktion ──
        // Bevorzuge das explizite Feld, dann Parse aus Text (Durchschnitt bei Ranges), dann DB-Fallback
        let wateringInterval;
        if (aiData.watering_interval_days && !isNaN(parseInt(aiData.watering_interval_days))) {
          wateringInterval = Math.max(1, Math.min(365, parseInt(aiData.watering_interval_days)));
        } else {
          // Parse aus "water"-Text: bei "7-10 Tage" → Durchschnitt 8, bei "7 Tage" → 7
          const waterText = aiData.water || "";
          const rangeMatch = waterText.match(/(\d+)\s*[-–]\s*(\d+)\s*Tag/i);
          const singleMatch = waterText.match(/(\d+)\s*Tag/i);
          if (rangeMatch) {
            wateringInterval = Math.round((parseInt(rangeMatch[1]) + parseInt(rangeMatch[2])) / 2);
          } else if (singleMatch) {
            wateringInterval = parseInt(singleMatch[1]);
          } else {
            wateringInterval = PLANT_DB[matchResult.type]?.watering_interval || 7;
          }
          wateringInterval = Math.max(1, Math.min(365, wateringInterval));
        }
        let plantAiData = {
          light: aiData.light || "Hell, indirekt",
          water: aiData.water || `Alle ${wateringInterval} Tage gießen`,
          watering_interval_days: wateringInterval,
          humidity: aiData.humidity || "Mittel",
          temperature: aiData.temperature || "18-25°C",
          fertilizer: aiData.fertilizer_type || aiData.fertilizer || "Standard Dünger alle 14 Tage",
          notes: aiData.notes || "Allgemeine Pflegehinweise beachten.",
          latin_name: aiData.latin_name || null,
          repot_months: parseInt(aiData.repot_months) || null,
          repot_season: aiData.repot_season || null,
          pruning_season: aiData.pruning_season !== undefined ? aiData.pruning_season : null,
          pruning_length_cm: aiData.pruning_length_cm != null ? parseInt(aiData.pruning_length_cm) : null,
          growth_rate: aiData.growth_rate || null,
        };
        
        // If using fallback, merge fallback data — BUT preserve the AI-derived wateringInterval
        if (matchResult.fallback && matchResult.fallbackData) {
          setMatchInfo({
            fallback: true,
            message: matchResult.fallbackData.notes,
            category: matchResult.fallbackData.category
          });
          // Merge fallback data but keep AI-derived fields if available
          plantAiData = { ...matchResult.fallbackData, ...plantAiData };
        } else {
          setMatchInfo({
            fallback: false,
            confidence: Math.round((matchResult.confidence || 0.9) * 100)
          });
        }
        
        const newPlant = {
          id: Date.now().toString(),
          name: aiData.name || name.trim(),
          custom_name: customName.trim() || null,
          type: matchResult.type,
          matchConfidence: matchResult.confidence,
          matchStrategy: matchResult.strategy,
          isFallback: matchResult.fallback || false,
          notes: notes,
          added_date: new Date().toISOString(),
          last_watered_date: alreadyWatered ? new Date().toISOString() : null,
          aiData: plantAiData,
          watering_interval: wateringInterval,
          fertilizer_interval: fertilizerEnabled ? fertilizerInterval : (aiFertilizerInterval > 0 ? aiFertilizerInterval : 0),
          fertilizer_type: fertilizerEnabled ? fertilizerType : (aiData.fertilizer_type || aiData.fertilizer || ""),
          last_fertilized_date: (fertilizerEnabled || aiFertilizerInterval > 0) ? new Date().toISOString() : null,
          room_id: roomId || null
        };
        onAdd(newPlant);
      } catch (e) {
        // Fallback: use robust matching even if API fails
        const matchResult = findMatchingTypeWithFallback(name.trim());
        const fallbackData = matchResult.fallbackData || getFallbackData(name.trim(), { type: 'unknown' });
        
        setMatchInfo({
          fallback: true,
          message: fallbackData.notes,
          category: fallbackData.category,
          apiError: true
        });
        
        const fallbackWateringInterval = (() => {
          // Try to use the matched plant type's DB interval first
          if (matchResult.type && matchResult.type !== "Andere" && PLANT_DB[matchResult.type]) {
            return PLANT_DB[matchResult.type].watering_interval;
          }
          // Then parse from fallback text
          const parsed = parseInt(fallbackData.water?.match(/\d+/)?.[0] || "7");
          return Math.max(1, parsed);
        })();
        
        const newPlant = {
          id: Date.now().toString(),
          name: name.trim(),
          custom_name: customName.trim() || null,
          type: "Andere",
          matchConfidence: 0.1,
          matchStrategy: 'fallback',
          isFallback: true,
          notes: notes,
          added_date: new Date().toISOString(),
          last_watered_date: alreadyWatered ? new Date().toISOString() : null,
          aiData: fallbackData,
          watering_interval: fallbackWateringInterval,
          fertilizer_type: fertilizerEnabled ? fertilizerType : fallbackData.fertilizer_type,
          last_fertilized_date: (fertilizerEnabled || fallbackData.fertilizer_interval > 0) ? new Date().toISOString() : null,
          room_id: roomId || null
        };
        onAdd(newPlant);
      } finally {
        setIsLoading(false);
      }
    };

    const addManually = () => {
      if (!name.trim()) return;

        name: name.trim(),

  // ── App ────────────────────────────────────────────────
  function App() {
    const [plants, setPlants] = useState([]);
    const [view, setView] = useState("home");
    const [selectedPlant, setSelectedPlant] = useState(null);
    const [showAdd, setShowAdd] = useState(false);
    const [loaded, setLoaded] = useState(false);
    const [rooms, setRooms] = useState(DEFAULT_ROOMS);
    const [weather, setWeather] = useState(null);

    useEffect(() => {
      const currentTheme = getTheme();
      C = currentTheme === "dark" ? C_DARK : C_LIGHT;
      if (currentTheme === "dark") {
        document.documentElement.classList.add("dark");
        document.body.classList.add("dark");
      }
    }, []);

    useEffect(() => {
      try {
        const saved = localStorage.getItem("pflanzenpflege_v1");
        if (saved) {
          const data = JSON.parse(saved);
          const migrated = data.map(p => ({
            ...p,
            last_watered_date: p.last_watered_date || p.lastWatered || null
          }));
          setPlants(migrated);
        }
        
        let roomsToUse = DEFAULT_ROOMS;
        const savedRoomsRaw = localStorage.getItem("pflanzen_rooms");
        if (savedRoomsRaw) {
          try {
            const savedRooms = JSON.parse(savedRoomsRaw);
            if (Array.isArray(savedRooms) && savedRooms.length > 0) {
              roomsToUse = savedRooms;
            }
          } catch(e) {
            // Silent fail - use defaults
          }
        }
        setRooms(roomsToUse);
        
      } catch (e) {
        // Silent fail - use defaults
        setRooms(DEFAULT_ROOMS);
      }
      setLoaded(true);
      fetchWeather().then(w => { if(w) setWeather(w); });
    }, []);

    // ── Gieß-Erinnerungs-Logik (Notification-Skeleton) ─────
    useEffect(() => {
      if (!loaded) return;
      const thirsty = plants.filter(needsWater);
      if (thirsty.length > 0) {
        console.log("🔔 Gieß-Erinnerung:");
        thirsty.forEach(p => {
          console.log(`- ${p.name} (${p.type}) muss heute gegossen werden!`);
        });
        // Hier könnte eine Integration für Cloud Functions oder Web Push stehen.
      }
    }, [loaded, plants]);

    const save = useCallback((updated) => {
      setPlants(updated);
      try { localStorage.setItem("pflanzenpflege_v1", JSON.stringify(updated)); } catch {}
    }, []);

    const waterPlant = id => save(plants.map(p => p.id === id ? { ...p, last_watered_date: new Date().toISOString() } : p));
    const fertilizePlant = id => save(plants.map(p => p.id === id ? { ...p, last_fertilized_date: new Date().toISOString() } : p));
    const deletePlant = id => { save(plants.filter(p => p.id !== id)); setSelectedPlant(null); setView("plants"); };
    const updateCustomName = (id, customName) => save(plants.map(p => p.id === id ? { ...p, custom_name: customName || null } : p));
    const updatePlant = (id, fields) => save(plants.map(p => p.id === id ? { ...p, ...fields } : p));

    if (!loaded) return React.createElement('div', { id: 'loading', style: { display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", background: C.bg } },
      React.createElement('span', { style: { fontSize: 48 } }, "🌿")
    );

    if (showAdd) return React.createElement(AddPlant, { onAdd: p => { save([...plants, p]); setShowAdd(false); }, onBack: () => setShowAdd(false), existingPlants: plants, rooms });

    if (selectedPlant) {
      const plant = plants.find(p => p.id === selectedPlant);
      if (!plant) { setSelectedPlant(null); return null; }
      const room = rooms.find(r => r.id === plant.room_id);
      return React.createElement(PlantDetail, { plant, room, onBack: () => setSelectedPlant(null), onWater: waterPlant, onFertilize: fertilizePlant, onDelete: deletePlant, onUpdateCustomName: updateCustomName, onUpdatePlant: updatePlant });
    }

    return React.createElement('div', { style: { maxWidth: 430, margin: "0 auto", minHeight: "100vh", background: C.bg, paddingBottom: 90 } },
      view === "home" && React.createElement(HomeView, { plants, rooms, onWater: waterPlant, onSelect: setSelectedPlant, onAdd: () => setShowAdd(true) }),
      view === "plants" && React.createElement(PlantsView, { plants, rooms, onSelect: setSelectedPlant, onAdd: () => setShowAdd(true) }),
      view === "rooms" && React.createElement(RoomView, { 
        rooms, 
        plants, 
        weather, 
        onSelectPlant: id => { setSelectedPlant(id); setView("plants"); },
        onEditRoom: (id, data) => {
          const updated = rooms.map(r => r.id === id ? {...r, ...data} : r);
          setRooms(updated);
          try { localStorage.setItem("pflanzen_rooms", JSON.stringify(updated)); } catch {}
        },
        onAddRoom: room => {
          const updated = [...rooms, room];
          setRooms(updated);
          try { localStorage.setItem("pflanzen_rooms", JSON.stringify(updated)); } catch {}
        }
      }),
      view === "discover" && React.createElement(DiscoverView),
      view === "settings" && React.createElement(SettingsView),
      React.createElement(BottomNav, { active: view, onChange: setView, onAdd: (view === "settings" || view === "rooms" || view === "discover") ? null : () => setShowAdd(true) })
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));

        TestRunner.log('CATEGORY_DEFAULTS', !!CATEGORY_DEFAULTS.succulent);
        TestRunner.log('getFallbackData', !!getFallbackData('X', { type: 'unknown' }).water);
        TestRunner.log('getEnhancedWateringInterval', !!getEnhancedWateringInterval({ type: 'Monstera', last_watered_date: null }, { name: 'Wohnzimmer', temperature: 20 }).interval);
        const kaktusResult = getEnhancedWateringInterval({ type: 'Kaktus', last_watered_date: null }, { name: 'Balkon', temperature: 25 });
        TestRunner.log('Kaktus min 7 days', kaktusResult.interval >= 7, kaktusResult.interval + ' days');
        const base = getBaseWateringInterval('Sukkulente');
        const minAllowed = base * 0.7;
        TestRunner.log('Safety cap applied', kaktusResult.interval >= minAllowed);
        TestRunner.log('Dark mode toggle', (setThemeMode('dark'), getTheme() === 'dark'));
        TestRunner.log('Dark mode restored', (setThemeMode('light'), getTheme() === 'light'));

        // ── NEW: Watering Interval Bug Regression Tests ──
        console.log('\n--- Gießintervall-Tests ---');

        // Test: AI watering_interval_days as string (BUG 3)
        const rawDaysStr = "9";
        const parsedStr = parseInt(rawDaysStr);
        TestRunner.log('watering_interval_days als String parsen', !isNaN(parsedStr) && parsedStr === 9, `"${rawDaysStr}" → ${parsedStr}`);

        // Test: Range parsing from water text
        const waterText1 = "Alle 7-10 Tage gießen, Erde antrocknen lassen";
        const rangeMatch1 = waterText1.match(/(\d+)\s*[-–]\s*(\d+)\s*Tag/i);
        const avgInterval = rangeMatch1 ? Math.round((parseInt(rangeMatch1[1]) + parseInt(rangeMatch1[2])) / 2) : null;
        TestRunner.log('Range-Parse "7-10 Tage" → 9', avgInterval === 9, avgInterval + ' days');

        // Test: Single day parsing
        const waterText2 = "Alle 14 Tage gießen";
        const singleMatch2 = waterText2.match(/(\d+)\s*Tag/i);
        TestRunner.log('Single-Parse "14 Tage" → 14', singleMatch2 && parseInt(singleMatch2[1]) === 14);

        // Test: Fallback merge order - AI values must win over fallback (BUG 1/4)
        const aiDerived = { watering_interval_days: 12, water: "Alle 12 Tage", light: "Hell" };
        const fallbackDefaults = { watering_interval_days: 7, water: "Alle 7 Tage", light: "Indirekt", notes: "Fallback note" };
        const merged = { ...fallbackDefaults, ...aiDerived }; // AI wins
        TestRunner.log('Fallback-Merge: KI überschreibt Fallback', merged.watering_interval_days === 12, `${merged.watering_interval_days} (erwartet 12)`);

        // Test: getEnhancedWateringInterval uses plant.watering_interval as base
        const plantWithAiInterval = { type: 'Monstera', watering_interval: 11, last_watered_date: null };
        const enhanced = getEnhancedWateringInterval(plantWithAiInterval, { name: 'Wohnzimmer', temperature: 20 });
        TestRunner.log('Enhanced interval basiert auf plant.watering_interval', enhanced.baseInterval === 11, `baseInterval=${enhanced.baseInterval}`);

        // Test: DB interval is NOT used when plant.watering_interval is set
        const dbInterval = PLANT_DB['Monstera']?.watering_interval || 9;
        TestRunner.log('plant.watering_interval hat Priorität vor DB', enhanced.baseInterval !== dbInterval || plantWithAiInterval.watering_interval === dbInterval,
          `plant=${plantWithAiInterval.watering_interval}, DB=${dbInterval}, base=${enhanced.baseInterval}`);

        // Test: wasAdjusted flag consistency
        const unadjustedPlant = { type: 'Monstera', watering_interval: 9, last_watered_date: null };
        const unadjustedResult = getEnhancedWateringInterval(unadjustedPlant, { name: 'Wohnzimmer', temperature: 20 });
        TestRunner.log('wasAdjusted korrekt gesetzt', typeof unadjustedResult.wasAdjusted === 'boolean');

        // Test: Extreme edge cases
        const zeroIntervalPlant = { type: 'Monstera', watering_interval: 0, last_watered_date: null };
        const zeroResult = getEnhancedWateringInterval(zeroIntervalPlant, null);
        TestRunner.log('watering_interval=0 fällt auf DB zurück', zeroResult.interval > 0, `interval=${zeroResult.interval}`);

        const nullTypePlant = { type: null, watering_interval: 7, last_watered_date: null };
        const nullResult = getEnhancedWateringInterval(nullTypePlant, null);
        TestRunner.log('type=null gibt sicheren Fallback', nullResult.interval === 7);

      } catch(e) { console.error('Test error:', e); }
      return TestRunner.summary();
    }
    window.runTests = runAllTests;
    console.log('✅ Tests verfügbar: runTests() eingeben\n');
  })();
  </script>
